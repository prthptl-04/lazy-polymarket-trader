# Fund configuration.
#
# Every value here can be overridden by an environment variable (see
# trading/fund_config.py). Env wins, so deployment-specific numbers need not be
# committed.
#
# The watchlists ship EMPTY on purpose. A default watchlist would mean that
# anyone who runs this without reading the config starts trading names they
# never chose. An empty list trades nothing, which is the correct behaviour for
# a file nobody has looked at yet.

[fund]
# Capital the sizing math works against.
# Matches the funded Robinhood Agentic account (verified $500 on 2026-09-12).
bankroll_usd = 500.0

# How often a cycle runs. Swing horizon — this is not an HFT loop.
cycle_interval_seconds = 300.0

# Daily loss kill-switch. Once intraday drawdown reaches this, no new risk is
# taken for the rest of the day; exits stay open. Keep it well under 25% of
# bankroll or it will not fire before real damage is done.
max_daily_loss_usd = 50.0   # 10% of bankroll

# Upper bound on deliberations per cycle. Each one costs six LLM calls, so this
# is the main lever on token spend.
max_candidates_per_cycle = 5

# Bars of history fetched per candidate (ATR, CVaR, Amihud).
lookback_bars = 60

# Robinhood Agentic account equity, used for the PDT threshold check.
# Under $25,000 the Pattern Day Trader rule binds: 3 day trades per 5 business
# days on equities. Crypto is exempt.
account_equity_usd = 500.0

# Interrupted deliberations older than this are abandoned rather than resumed.
# A thesis reasons about prices at a moment in time; an hour-old conclusion
# applied to a moved market is worse than no conclusion.
resume_max_age_seconds = 3600.0

[watchlist]
# EMPTY on purpose: the scout screens the whole US tape each cycle (~12,500
# tickers) and ranks by liquidity and momentum. Fill this in only to pin the
# fund to specific names, which overrides discovery entirely.
equity = []

# Traded nights, weekends and market holidays. Exempt from the PDT rule, which
# is why the weekend rotation exists.
# Set FUND_CRYPTO_WATCHLIST in .env instead — a tracked file must not
# decide what a fresh clone trades.
crypto = []

[data]
# none   — no price history; every candidate is pre-screened out. Safe default.
# static — supplied in code; used by tests, backtests and replay.
#
# massive — bars from Massive (equity + crypto, verified entitled), fundamentals
#           from SEC EDGAR (free), and live quotes from Robinhood when the
#           daemon holds an authenticated MCP session.
provider = "massive"
