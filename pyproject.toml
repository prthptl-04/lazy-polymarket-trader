[project]
name = "lazy-polymarket-trader"
version = "0.1.0"
description = "Autonomous Polymarket trading bot orchestrated by three Managed Agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "py-clob-client>=0.17.0",
    "browser-use>=0.1.0",
    "python-dotenv>=1.0.0",
    "scrapling>=0.4.8",
    "fastapi>=0.136.3",
    "uvicorn>=0.46.0",
    "polymarket-us>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "trading", "verification", "monitoring", "memory", "cache", "product", "web_scraper", "github_publisher", "vulnerability_detector", "finance", "research_agent", "observability", "tool_evaluation", "live_market", "decision_tree", "code_graph", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
